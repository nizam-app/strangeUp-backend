openapi: 3.1.0
info:
  title: StrangeUp Push Device Registration (Task 023C)
  version: 0.1.0
  description: >
    FCM-ready device registration and notification preferences. Task 023D adds server-side
    outbox/worker; PUSH_ENABLED defaults false (no live Firebase until authorized).
servers:
  - url: http://localhost:3000
paths:
  /v1/me/device-tokens:
    get:
      summary: List caller's active device registrations (no raw FCM tokens)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Device list }
        "403": { description: Main app not activated }
    post:
      summary: Register or rotate device token for current user
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [platform, registrationToken, deviceBindingId]
              properties:
                platform: { type: string, enum: [android, ios] }
                registrationToken: { type: string, minLength: 20, maxLength: 4096 }
                deviceBindingId: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200": { description: Registered (metadata only) }
  /v1/me/device-tokens/{deviceTokenId}:
    delete:
      summary: Revoke own device registration
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: deviceTokenId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Revoked }
        "404": { description: Not found or not owned }
  /v1/me/notification-preferences:
    get:
      summary: Read notification delivery preferences
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Preferences with deliveryStatus PUSH_DISABLED or PUSH_ENABLED }
    patch:
      summary: Update notification delivery preferences
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                pushEnabled: { type: boolean }
                directMessagesEnabled: { type: boolean }
                messageRequestsEnabled: { type: boolean }
                groupMembershipEnabled: { type: boolean }
                groupChatEnabled: { type: boolean }
                activityUpdatesEnabled: { type: boolean }
                meetupInvitesEnabled: { type: boolean }
                marketingEnabled: { type: boolean }
      responses:
        "200": { description: Updated preferences }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
