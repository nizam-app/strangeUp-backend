openapi: 3.1.0
info:
  title: StrangeUp Membership Plans & Entitlements API (Task 017 / 026A)
  version: 0.2.0
  description: |
    Screen 18 membership plans — read-only catalog, self status, and versioned `flow` capability contract.
    Owner 2026-10-28: defer ALL payment/subscription billing. No subscribe, upgrade, webhooks, or receipts.
    Feature rows use AVAILABLE | NOT_CONFIGURED | DEFERRED | NOT_IMPLEMENTED.
servers:
  - url: http://localhost:3000
paths:
  /v1/membership/plans:
    get:
      summary: Membership plan catalog (LIVE)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: plans[], billingConfigured false, flow contract (checkout DEFERRED)
        "401":
          description: Not authenticated
        "403":
          description: Account unavailable
  /v1/me/membership:
    get:
      summary: Self membership and entitlements (LIVE)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: BASIC/FREE self status, entitlements, flow contract; canUpgrade false
        "401":
          description: Not authenticated
        "403":
          description: Account unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
