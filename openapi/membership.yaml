openapi: 3.1.0
info:
  title: StrangeUp Membership Plans & Entitlements API (Task 017)
  version: 0.1.0
  description: |
    Screen 18 membership plans — honest catalog and self status only.
    No subscribe, upgrade, trial-start, billing webhooks, or payment intents (D-08 / MKT-03 deferred).
servers:
  - url: http://localhost:3000
paths:
  /v1/membership/plans:
    get:
      summary: Membership plan catalog (LIVE)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: BASIC available (free); CLUB NOT_CONFIGURED; no live Club pricing
        "401":
          description: Not authenticated
        "403":
          description: Account unavailable
  /v1/me/membership:
    get:
      summary: Self membership and entitlements (LIVE)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Default BASIC/FREE; billingStatus NOT_CONFIGURED; canUpgrade false
        "401":
          description: Not authenticated
        "403":
          description: Account unavailable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
