openapi: 3.1.0
info:
  title: StrangeUp Admin API (Task 022B / 024B — backend only)
  version: 0.2.0-task024b
  description: Identity review (IDENTITY_REVIEWER or SUPER_ADMIN) and store catalog ops (STORE_CATALOG_MANAGER or SUPER_ADMIN + STORE_CATALOG_MANAGEMENT_ENABLED).
servers:
  - url: http://localhost:3000
paths:
  /v1/admin/identity-reviews/summary:
    get:
      summary: Global identity review queue status totals (not filtered by list search)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Counts for PENDING (provider-approved queue), APPROVED, REJECTED
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [
                        scope,
                        pending,
                        pendingActionable,
                        pendingOnHold,
                        pendingTotal,
                        approved,
                        rejected,
                      ]
                    properties:
                      scope:
                        type: string
                        enum: [GLOBAL_STATUS_TOTALS]
                      pending:
                        { type: integer, minimum: 0, description: Same as pendingTotal (compat) }
                      pendingActionable: { type: integer, minimum: 0 }
                      pendingOnHold:
                        { type: integer, minimum: 0, description: NEEDS_FURTHER_REVIEW queue rows }
                      pendingTotal: { type: integer, minimum: 0 }
                      approved: { type: integer, minimum: 0 }
                      rejected: { type: integer, minimum: 0 }
        "403": { description: Not an identity reviewer }
  /v1/admin/identity-reviews/batch-decide:
    post:
      summary: Batch approve or reject up to 10 actionable pending reviews (non-atomic)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, reviewIds, batchRequestId]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT]
                reviewIds:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string, format: uuid }
                reasonCode:
                  type: string
                  enum:
                    - POLICY_INELIGIBLE
                    - IDENTITY_MISMATCH
                    - INSUFFICIENT_EVIDENCE
                    - FRAUD_SUSPECTED
                    - OTHER_ADMIN_DECISION
                batchRequestId:
                  type: string
                  minLength: 8
                  maxLength: 128
      responses:
        "200": { description: All items succeeded (or idempotent replay) }
        "422":
          {
            description: Batch processed but zero or partial successes — see per-item results in body,
          }
        "400": { description: Validation error }
        "403": { description: Forbidden }
  /v1/admin/identity-reviews/export:
    get:
      summary: Filtered CSV export of identity review queue (reviewer-only, max 1000 rows)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING }
        - in: query
          name: posture
          schema: { type: string, enum: [all, actionable, on_hold] }
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: submittedFrom
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - in: query
          name: submittedTo
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - in: query
          name: identityVerificationStatus
          schema:
            type: string
            enum: [NOT_STARTED, PENDING, APPROVED, REJECTED, EXPIRED, REVOKED]
      responses:
        "200":
          description: CSV attachment (UTF-8); X-Identity-Review-Export-* metadata headers
        "400": { description: Invalid filters }
        "403": { description: Not an identity reviewer }
  /v1/admin/identity-reviews:
    get:
      summary: Paginated identity review queue
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED], default: PENDING }
        - in: query
          name: posture
          description: When status=PENDING — all (default), actionable (PENDING only), on_hold (NEEDS_FURTHER_REVIEW)
          schema: { type: string, enum: [all, actionable, on_hold] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: q
          description: Exact reviewId (UUID), email prefix on normalized email, or name (min 2 chars)
          schema: { type: string, maxLength: 120 }
        - in: query
          name: submittedFrom
          description: Provider session completedAt lower bound (UTC calendar date, inclusive)
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - in: query
          name: submittedTo
          description: Provider session completedAt upper bound (UTC calendar date, inclusive)
          schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
        - in: query
          name: identityVerificationStatus
          schema:
            type: string
            enum: [NOT_STARTED, PENDING, APPROVED, REJECTED, EXPIRED, REVOKED]
      responses:
        "200": { description: Review list }
        "400": { description: Invalid search, date range, or cursor/filter mismatch }
        "403": { description: Not an identity reviewer }
  /v1/admin/identity-reviews/{reviewId}/decisions:
    get:
      summary: Paginated admin review decision audit rows (reviewer-only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Decision page (newest first; cursor on createdAt + decisionId)
        "400": { description: Invalid limit or cursor }
        "403": { description: Not an identity reviewer }
        "404": { description: Review not found }
  /v1/admin/identity-reviews/{reviewId}/notes:
    get:
      summary: Paginated internal staff notes (reviewer-only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200": { description: Note page }
        "403": { description: Not an identity reviewer }
        "404": { description: Review not found }
    post:
      summary: Append internal staff note (open review only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201": { description: Note created }
        "403": { description: Forbidden / self-review }
        "409": { description: Terminal review or invalid state }
  /v1/admin/identity-reviews/{reviewId}/needs-further-review:
    post:
      summary: Internal hold (NEEDS_FURTHER_REVIEW); no applicant notification
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                optionalNote: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200": { description: On hold }
        "403": { description: Forbidden }
        "409": { description: Conflict / stale session }
  /v1/admin/identity-reviews/{reviewId}/return-to-pending:
    post:
      summary: Release internal hold back to actionable PENDING
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                optionalNote: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200": { description: Returned to pending }
        "403": { description: Forbidden }
        "409": { description: Not on hold / stale session }
  /v1/admin/identity-reviews/{reviewId}/avatar:
    get:
      summary: Applicant profile avatar bytes (staff; general media only — not KYC evidence)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Image bytes (private cache) }
        "404": { description: Review or avatar not found }
        "403": { description: Not an identity reviewer }
  /v1/admin/identity-reviews/{reviewId}:
    get:
      summary: Review detail (reviewId = applicant userId)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Detail }
        "404": { description: Not found }
  /v1/admin/identity-reviews/{reviewId}/approve:
    post:
      summary: Approve activation for current provider-approved session
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Approved or idempotent replay }
        "403": { description: Eligibility or authorization failure }
        "409": { description: Concurrent or stale review state }
  /v1/admin/identity-reviews/{reviewId}/reject:
    post:
      summary: Reject activation (bounded reason code)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
        - in: path
          name: reviewId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode]
              properties:
                reasonCode:
                  type: string
                  enum:
                    - POLICY_INELIGIBLE
                    - IDENTITY_MISMATCH
                    - INSUFFICIENT_EVIDENCE
                    - FRAUD_SUSPECTED
                    - OTHER_ADMIN_DECISION
      responses:
        "200": { description: Rejected }
        "400": { description: Invalid reason }
        "403": { description: Forbidden }
        "409": { description: Conflict }
  /v1/admin/activities/summary:
    get:
      summary: Global activity lifecycle totals, schedule windows, and filter catalogs (Task 033B)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: DRAFT/PUBLISHED/CANCELLED/COMPLETED totals, published in-session/upcoming-14-day windows, category and city catalogs
        "403": { description: Not an identity reviewer or super admin }
  /v1/admin/activities/export:
    get:
      summary: Privacy-safe activities CSV export (read-only, capped)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: CSV of matching directory rows without meeting secrets }
        "403": { description: Not an identity reviewer or super admin }
  /v1/admin/activities:
    get:
      summary: Paginated admin activity directory (read-only)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 120 }
        - in: query
          name: status
          schema: { type: string, enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED] }
        - in: query
          name: mode
          schema: { type: string, enum: [IN_PERSON, VIRTUAL, HYBRID] }
        - in: query
          name: audience
          schema: { type: string, enum: [PUBLIC, FOLLOWERS_ONLY] }
        - in: query
          name: category
          schema: { type: string }
        - in: query
          name: location
          schema: { type: string }
        - in: query
          name: month
          schema: { type: string, example: "2026-10" }
        - in: query
          name: when
          schema: { type: string, enum: [upcoming, past, active, all] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          { description: Activity rows with host preview, attendance tallies, and totalMatching }
        "400": { description: Invalid query or cursor }
        "403": { description: Not an identity reviewer or super admin }
  /v1/admin/activities/{activityId}:
    get:
      summary: Staff activity detail (read-only, privacy-safe)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: activityId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          { description: Detail without meeting instructions, coordinates, or raw storage keys }
        "404": { description: Activity not found }
        "403": { description: Not an identity reviewer or super admin }
  /v1/admin/activities/{activityId}/cover:
    get:
      summary: Staff activity cover bytes
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: activityId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Image bytes }
        "404": { description: Activity or cover not found }
        "403": { description: Not an identity reviewer or super admin }
  /v1/admin/store-catalog/products:
    get:
      summary: List store products (operator; all statuses)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Product list }
        "403": { description: FEATURE_DISABLED or not STORE_CATALOG_MANAGER }
    post:
      summary: Create DRAFT product
      security: [{ bearerAuth: [] }]
      responses:
        "201": { description: Created }
  /v1/admin/store-catalog/products/{productId}/publish:
    post:
      summary: Publish when eligibility passes
      security: [{ bearerAuth: [] }]
  /v1/admin/store-catalog/products/{productId}/images:
    post:
      summary: Ingest product image (multipart field image)
      security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
