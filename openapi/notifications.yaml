openapi: 3.1.0
info:
  title: StrangeUp In-App Notifications API
  version: 0.1.0-task013
paths:
  /v1/me/notifications:
    get:
      summary: Notification inbox (pull-only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50 }
        - in: query
          name: unreadOnly
          schema: { type: string, enum: ["true", "false"] }
      responses:
        "200":
          description: Notifications plus unreadCount
  /v1/me/notifications/{notificationId}/read:
    post:
      summary: Idempotent mark one notification read
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Updated notification
        "404":
          description: NOT_FOUND (wrong recipient)
  /v1/me/notifications/read-all:
    post:
      summary: Mark all unread notifications read for caller
      security:
        - bearerAuth: []
      responses:
        "200":
          description: updatedCount
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
