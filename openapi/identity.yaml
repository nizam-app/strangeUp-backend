openapi: 3.1.0
info:
  title: StrangeUp Identity API (Phase 1)
  version: 0.1.0
  description: Identity Phase 1 (Tasks 002B.1–002B.2). Email/password auth, password reset, self account/profile. Uses foundation envelope.
servers:
  - url: http://localhost:3000
paths:
  /v1/auth/register:
    post:
      summary: Register with email and password
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Created
        "400":
          description: Validation error
        "409":
          description: Conflict
        "429":
          description: Rate limited
  /v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens issued
        "401":
          description: Invalid credentials
        "403":
          description: Account unavailable
  /v1/auth/refresh:
    post:
      summary: Rotate refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New tokens
        "401":
          description: Unauthorized
  /v1/auth/logout:
    post:
      summary: Logout current session
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Success
  /v1/auth/logout-all:
    post:
      summary: Revoke all sessions
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Success
  /v1/auth/email-verification/request:
    post:
      summary: Resend email verification
      security: [{ bearerAuth: [] }]
      responses:
        "202":
          description: Accepted
  /v1/auth/email-verification/confirm:
    post:
      summary: Confirm email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: Verified
        "400":
          description: Challenge expired
  /v1/auth/password-reset/request:
    post:
      summary: Request password reset (enumeration-safe)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: Accepted (same body whether account exists)
        "429":
          description: Rate limited
  /v1/auth/password-reset/confirm:
    post:
      summary: Confirm password reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated; all sessions revoked
        "400":
          description: Challenge expired or validation error
  /v1/me/account:
    get:
      summary: Get own account status
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Account DTO
        "401":
          description: Unauthorized
        "403":
          description: Account unavailable
  /v1/me/profile:
    get:
      summary: Get own profile
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Profile DTO
        "401":
          description: Unauthorized
        "403":
          description: Account unavailable
    patch:
      summary: Update own profile (narrow allowlist)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfilePatchRequest"
      responses:
        "200":
          description: Updated profile
        "400":
          description: Validation error
        "403":
          description: Cannot edit in current account state
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegisterRequest:
      type: object
      required:
        - firstName
        - lastName
        - email
        - password
        - dateOfBirth
        - consents
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        dateOfBirth:
          type: string
          description: "YYYY-MM-DD (UTC calendar); must be past date; USA 18+ rule enforced"
        consents:
          type: array
          items:
            type: object
            required: [type, version]
            properties:
              type:
                type: string
                enum: [TERMS, PRIVACY, AGE_ATTESTATION]
              version:
                type: string
                description: Client-supplied until counsel publishes canonical IDs (release blocker)
    ProfilePatchRequest:
      type: object
      additionalProperties: false
      properties:
        firstName: { type: string, maxLength: 80 }
        lastName: { type: string, maxLength: 80 }
        displayName: { type: string, maxLength: 120 }
        bio: { type: string, maxLength: 500 }
        scheduleTimeZone:
          type: string
          description: IANA time zone identifier
